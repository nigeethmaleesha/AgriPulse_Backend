services:
  postgres:
    image: postgres:17-alpine
    container_name: agripulse-postgres
    environment:
      POSTGRES_DB: agripulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - agripulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agripulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agripulse_pgdata:
