spring.application.name=spoilage-risk-ranking

# Module 4 uses a separate development database by default so it does not
# collide with Module 3. For final group integration, override DB_NAME.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agripulse_module4_spoilage}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Module 4 defaults to 8081 so it can run beside the earlier Module 3 app on 8080.
# Override with SERVER_PORT=8080 if Module 3 is not running.
server.port=${SERVER_PORT:8081}
