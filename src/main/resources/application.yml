server:
  port: 9084

spring:
  application:
    name: agripulse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agripulse_5}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

agripulse:
  seed-demo: ${SEED_DEMO:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
